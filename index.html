<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Vault Archive · Pip-Boy 3000 (Mk I) · Mario Muñoz Pequeño</title>
    <meta
      name="description"
      content="Portfolio dentro de un Pip-Boy 3000 de Fallout 3: carcasa física, seis módulos que funcionan y una radio con música real."
    />
    <meta name="theme-color" content="#0c0f0b" />

    <!-- ==========================================================================
         Open Graph / Twitter card — what WhatsApp, Telegram, X, Slack, Discord
         and iMessage show when the link is pasted.

         og:image has to be an ABSOLUTE url: these crawlers do not resolve
         relative paths, and they do not run JavaScript, so a url built at
         runtime from import.meta.env.BASE_URL would arrive empty. That is why
         the domain is written out here even though Vite's `base` is
         /Vault-Archive/. If the site ever moves, this block and only this
         block has to change.

         The image lives in public/og.png (1200x630). See public/.gitkeep.
         ========================================================================== -->
    <!-- Favicon. `public/` is copied to the root of the build untouched, so
         this resolves to <base>/favicon.ico. `%BASE_URL%` rather than a literal
         path: Vite substitutes the configured base when it builds, so the link
         keeps working if `base` ever changes.
         The .ico carries 16, 32, 48, 64, 128 and 256 so the tab, the bookmarks
         bar and a desktop shortcut all get a legible one. -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />

    <!-- The tab icon has to be an .ico, but iOS ignores those: for "add to home
         screen" it wants a square PNG. 256x256 is what the site ships; Safari
         scales it down itself. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/256.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="%BASE_URL%icons/128.png" />

    <!-- Android install prompt and the splash colour. The paths inside
         public/site.webmanifest are absolute and hand-written, so that file is
         the one place that breaks if `base` changes. -->
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vault Archive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="canonical" href="https://MarioMunPeq.github.io/Vault-Archive/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vault Archive" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://MarioMunPeq.github.io/Vault-Archive/" />
    <meta
      property="og:title"
      content="Vault Archive · Pip-Boy 3000 (Mk I)"
    />
    <meta
      property="og:description"
      content="Seis módulos, un tubo de rayos catódicos y ni una sola página web: un portfolio dentro de un Pip-Boy de Fallout 3."
    />
    <meta
      property="og:image"
      content="https://MarioMunPeq.github.io/Vault-Archive/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Cartel de Vault Archive: logotipo de Fallout Portfolio en azul sobre fondo verde fósforo, con el subtítulo Pip-Boy 3000 · Mario Muñoz Pequeño · Pega Developer."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vault Archive · Pip-Boy 3000 (Mk I)" />
    <meta
      name="twitter:description"
      content="Un portfolio dentro de un Pip-Boy 3000 de Fallout 3. Seis módulos que funcionan, y ni una sola página web."
    />
    <meta
      name="twitter:image"
      content="https://MarioMunPeq.github.io/Vault-Archive/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
